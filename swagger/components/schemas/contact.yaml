type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contacts's id"
    type: string
    example: 6877247b77522fbb03c865ca
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contacts's phone"
    type: string
    example: '+388005555555'
  email:
    description: "Contacts's email"
    type: string
    example: 'example@gmail.com'
  isFavourite:
    description: 'Whether contact is in favourite list'
    type: boolean
    example: true
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'Id of the user, who added this contact'
    type: string
    example: 6877247b77522fbb03c865ca
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
