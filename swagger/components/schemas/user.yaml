type: object
required:
  - _id
  - name
  - email
properties:
  _id:
    description: "User's id"
    type: string
    example: '6877247b77522fbb03c865ca'
  name:
    description: "User's name"
    type: string
    example: 'Tom Example'
  email:
    description: "User's email"
    type: string
    example: 'example@gmail.com'
