tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Reset password using JWT'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'JSON web token'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ODc2YTAxODkxZjM4OGEzODU4MmVkOWEiLCJlbWFpbCI6InRoZXJrYXNvYUB1a3IubmV0IiwiaWF0IjoxNzUyNjM4NDYxLCJleHAiOjE3NTI2Mzg3NjF9.JE_zVBtouE0zaN77Lb9aalenjcnAS5iIaNY3GxcXWKA'
          password:
            description: "User's password"
            type: string
            example: '123456'
responses:
  '200':
    description: 'Reset password'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              example: {}
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    $ref: ../../components/responses/500.yaml
